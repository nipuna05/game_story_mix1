<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fight1: Data Recovery</title>

  <body>
    <div id="start-screen">
      <h1>FIGHT1: DATA RECOVERY</h1>

      <div id="objective">DATA DRIVES: 0 / 3</div>

    </div>

    <script type="module" src="/src/main.js"></script>
    <div id="crosshair"></div>
